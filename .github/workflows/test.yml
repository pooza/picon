name: test
on:
  - push
permissions:
  contents: read
env:
  CI: 'true'
jobs:
  test:
    # ubuntu-latest（ImageMagick 7.1.2・Ghostscript 10.06）では PDF の変換が Permission denied で落ちる（#187）。
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version:
          - 20.x
          - 22.x
          - 24.x
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: apt install
        run: |
          sudo apt update
          sudo apt install imagemagick
          sudo apt install ffmpeg
      - run: yarn install --frozen-lockfile
      - run: npm run lint
      - run: |
          node picon.js &
          sleep 3
          npm test
