name: test
on:
  - push
env:
  CI: "true"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20.x
          - 22.x
          - 24.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: apt install
        run: |
          sudo apt update
          sudo apt install imagemagick
          sudo apt install ffmpeg
      - run: yarn install --frozen-lockfile
      - run: npm run lint
      - run: |
          node picon.js &
          sleep 3
          npm test
